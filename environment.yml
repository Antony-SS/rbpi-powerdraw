# ---------------------------------------------------------------
# Conda environment specification for Raspberry Pi Power Draw
# ---------------------------------------------------------------
name: powerdraw-env

channels:
  - conda-forge   # Community-maintained packages
  - defaults      # Official Anaconda packages

# Core runtime dependencies
# ---------------------------------------------------------------
dependencies:
  - python=3.11        
  - pip                
  - numpy             
  - psutil             

  - pip:
      - picamera2
      - opencv-python-headless # OpenCV for image processing
